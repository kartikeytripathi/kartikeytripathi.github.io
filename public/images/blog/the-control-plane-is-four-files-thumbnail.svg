<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#0f1117"/>
    </linearGradient>
    <linearGradient id="term-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="12%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="term-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
    <clipPath id="term-clip">
      <rect x="646" y="150" width="486" height="352" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06" fill="#ffffff">
    <circle cx="60" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/>
    <circle cx="420" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/>
    <circle cx="60" cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/>
    <circle cx="60" cy="420" r="1.5"/><circle cx="180" cy="420" r="1.5"/><circle cx="300" cy="420" r="1.5"/>
    <circle cx="420" cy="420" r="1.5"/><circle cx="540" cy="420" r="1.5"/>
    <circle cx="60" cy="540" r="1.5"/><circle cx="180" cy="540" r="1.5"/><circle cx="300" cy="540" r="1.5"/>
    <circle cx="420" cy="540" r="1.5"/><circle cx="540" cy="540" r="1.5"/>
  </g>

  <!-- Amber accent top bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#F5C842" opacity="0.9" filter="url(#glow)"/>

  <!-- Left amber accent bar -->
  <rect x="72" y="160" width="4" height="220" rx="2" fill="#F5C842" opacity="0.8" filter="url(#glow)"/>

  <!-- Main category label -->
  <text x="96" y="196" fill="#F5C842" font-size="14" font-weight="700" letter-spacing="4" opacity="0.9">KUBERNETES  ·  CKA  ·  CONTROL PLANE</text>

  <!-- Title -->
  <text x="96" y="276" fill="#E8E8E8" font-size="56" font-weight="700" letter-spacing="-1">The Control</text>
  <text x="96" y="348" fill="#E8E8E8" font-size="56" font-weight="700" letter-spacing="-1">Plane Is</text>
  <text x="96" y="420" fill="#F5C842" font-size="56" font-weight="700" letter-spacing="-1" filter="url(#glow-soft)">Four Files</text>

  <!-- Subtitle -->
  <text x="96" y="474" fill="#9CA3AF" font-size="18" letter-spacing="0">Static pods, etcd internals, two outages</text>

  <!-- Tags -->
  <rect x="96" y="512" width="108" height="28" rx="4" fill="#111111" stroke="#374151" stroke-width="1"/>
  <text x="150" y="531" fill="#9CA3AF" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">kubeadm</text>

  <rect x="216" y="512" width="72" height="28" rx="4" fill="#111111" stroke="#374151" stroke-width="1"/>
  <text x="252" y="531" fill="#9CA3AF" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">etcd</text>

  <rect x="300" y="512" width="64" height="28" rx="4" fill="#111111" stroke="#374151" stroke-width="1"/>
  <text x="332" y="531" fill="#9CA3AF" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">CKA</text>

  <rect x="376" y="512" width="132" height="28" rx="4" fill="#111111" stroke="#374151" stroke-width="1"/>
  <text x="442" y="531" fill="#9CA3AF" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">static pods</text>

  <!-- Realistic terminal window -->
  <rect x="646" y="166" width="486" height="352" rx="10" fill="#000000" opacity="0.55" filter="url(#term-shadow)"/>
  <g clip-path="url(#term-clip)">
    <rect x="646" y="150" width="486" height="352" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="646" y="150" width="486" height="34" fill="#2a2c30"/>
    <circle cx="668" cy="167" r="6" fill="#ff5f56"/>
    <circle cx="688" cy="167" r="6" fill="#ffbd2e"/>
    <circle cx="708" cy="167" r="6" fill="#27c93f"/>
    <text x="889" y="172" fill="#8b8b8d" font-size="12" text-anchor="middle" letter-spacing="0.5">root@cka-control-plane: ~</text>

    <!-- body -->
    <text x="666" y="212" font-size="14.5" letter-spacing="0.2">
      <tspan fill="#6fd97f">$</tspan><tspan fill="#d1d5db" dx="8">ls /etc/kubernetes/manifests/</tspan>
    </text>
    <text x="666" y="238" fill="#e6e8e4" font-size="14.5" letter-spacing="0.2">etcd.yaml</text>
    <text x="666" y="264" fill="#e6e8e4" font-size="14.5" letter-spacing="0.2">kube-apiserver.yaml</text>
    <text x="666" y="290" fill="#e6e8e4" font-size="14.5" letter-spacing="0.2">kube-controller-manager.yaml</text>
    <text x="666" y="316" fill="#e6e8e4" font-size="14.5" letter-spacing="0.2">kube-scheduler.yaml</text>

    <text x="666" y="356" font-size="14.5" letter-spacing="0.2">
      <tspan fill="#6fd97f">$</tspan><tspan fill="#d1d5db" dx="8">kubectl get deployments</tspan>
    </text>
    <text x="666" y="380" fill="#ff6b6b" font-size="13.5" letter-spacing="0.1">Error from server (Forbidden): deployments.apps</text>
    <text x="666" y="400" fill="#ff6b6b" font-size="13.5" letter-spacing="0.1">is forbidden: User "kubernetes-admin" cannot list</text>

    <text x="666" y="434" font-size="14.5" letter-spacing="0.2">
      <tspan fill="#6fd97f">$ </tspan>
    </text>
    <rect x="682" y="422" width="9" height="16" fill="#e6e8e4" opacity="0.85"/>

    <!-- glass sheen -->
    <rect x="646" y="184" width="486" height="60" fill="url(#term-sheen)"/>
  </g>
  <rect x="646" y="150" width="486" height="352" rx="10" fill="none" stroke="#31353a" stroke-width="1"/>
</svg>
