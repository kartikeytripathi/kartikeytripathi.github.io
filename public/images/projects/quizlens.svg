<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="QuizLens hero — highlight a question, get the answer">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F5C842" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#F5C842" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="amberSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C842" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5C842" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F5C842" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F5C842" fill-opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#0A0A0A"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g transform="translate(120, 130)" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace">
    <text x="0" y="0" font-size="88" font-weight="700" fill="#F5C842" filter="url(#softGlow)">◈</text>
    <text x="110" y="0" font-size="88" font-weight="700" fill="#E8E8E8" letter-spacing="-2">QuizLens</text>
    <text x="112" y="46" font-size="22" fill="#9CA3AF" letter-spacing="1">Highlight a question. Get the answer, the reasoning, and every trap.</text>
    <g transform="translate(112, 78)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#F5C842" fill-opacity="0.12" stroke="#F5C842" stroke-opacity="0.4"/>
      <text x="60" y="18" font-size="13" fill="#F5C842" text-anchor="middle" font-weight="600">AWS · CKA · K8s</text>
      <rect x="132" y="0" width="140" height="26" rx="13" fill="#1E1E1E" stroke="#333"/>
      <text x="202" y="18" font-size="13" fill="#9CA3AF" text-anchor="middle">Chrome Extension</text>
      <rect x="284" y="0" width="120" height="26" rx="13" fill="#1E1E1E" stroke="#333"/>
      <text x="344" y="18" font-size="13" fill="#9CA3AF" text-anchor="middle">Anthropic API</text>
    </g>
  </g>

  <!-- Left mock: question with highlight -->
  <g transform="translate(90, 350) rotate(-2)" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace">
    <rect x="0" y="0" width="620" height="440" rx="18" fill="url(#cardBg)" stroke="#2A2A2A"/>
    <!-- browser chrome -->
    <rect x="0" y="0" width="620" height="42" rx="18" fill="#161616"/>
    <rect x="0" y="24" width="620" height="18" fill="#161616"/>
    <circle cx="22" cy="21" r="6" fill="#3A3A3A"/>
    <circle cx="42" cy="21" r="6" fill="#3A3A3A"/>
    <circle cx="62" cy="21" r="6" fill="#3A3A3A"/>
    <rect x="100" y="12" width="440" height="18" rx="9" fill="#0F0F0F"/>
    <text x="120" y="25" font-size="12" fill="#6B7280">examtopics.com / question #142</text>

    <!-- question body -->
    <text x="32" y="90" font-size="14" fill="#9CA3AF">Question 142 · EKS</text>
    <text x="32" y="120" font-size="16" fill="#E8E8E8">A pod running in an Amazon EKS cluster needs to</text>
    <text x="32" y="144" font-size="16" fill="#E8E8E8">access an S3 bucket with the least privilege</text>
    <text x="32" y="168" font-size="16" fill="#E8E8E8">possible. Which approach should be used?</text>

    <!-- highlighted line effect -->
    <rect x="28" y="196" width="560" height="30" rx="4" fill="#F5C842" fill-opacity="0.22"/>
    <text x="32" y="216" font-size="15" fill="#F5F0DA" font-weight="600">A. Attach the required IAM policy to the node IAM role</text>

    <text x="32" y="252" font-size="15" fill="#B8B8B8">B. Use kube2iam to assume roles at pod level</text>
    <text x="32" y="278" font-size="15" fill="#B8B8B8">C. Configure IRSA — bind a service account to an IAM role via OIDC</text>
    <text x="32" y="304" font-size="15" fill="#B8B8B8">D. Store AWS credentials in a Kubernetes Secret</text>

    <!-- cursor + shortcut hint -->
    <g transform="translate(430, 350)">
      <rect x="0" y="0" width="160" height="52" rx="10" fill="#0F0F0F" stroke="#F5C842" stroke-opacity="0.5"/>
      <text x="16" y="22" font-size="11" fill="#9CA3AF">press to explain</text>
      <text x="16" y="42" font-size="18" fill="#F5C842" font-weight="700">Alt + Q</text>
      <text x="118" y="34" font-size="20" fill="#F5C842">⌨</text>
    </g>
  </g>

  <!-- Arrow flow -->
  <g transform="translate(730, 570)">
    <path d="M 0 0 L 130 0" stroke="url(#amberSweep)" stroke-width="3" fill="none"/>
    <path d="M 120 -10 L 140 0 L 120 10" stroke="#F5C842" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="70" y="-14" font-size="12" fill="#F5C842" text-anchor="middle" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAIN</text>
  </g>

  <!-- Right: QuizLens overlay panel -->
  <g transform="translate(890, 330) rotate(2)" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace">
    <rect x="0" y="0" width="620" height="480" rx="18" fill="url(#panelBg)" stroke="#F5C842" stroke-opacity="0.35"/>
    <!-- top amber line -->
    <rect x="18" y="0" width="584" height="2" fill="url(#amberSweep)"/>

    <!-- header -->
    <g transform="translate(28, 40)">
      <text x="0" y="0" font-size="20" fill="#F5C842" font-weight="700">◈</text>
      <text x="30" y="0" font-size="18" fill="#E8E8E8" font-weight="600">QuizLens</text>
      <rect x="470" y="-18" width="60" height="24" rx="6" fill="#1A1A1A" stroke="#333"/>
      <text x="500" y="-2" font-size="11" fill="#9CA3AF" text-anchor="middle">Copy</text>
      <rect x="540" y="-18" width="30" height="24" rx="6" fill="#1A1A1A" stroke="#333"/>
      <text x="555" y="-2" font-size="12" fill="#9CA3AF" text-anchor="middle">✕</text>
    </g>

    <!-- answer badge -->
    <g transform="translate(28, 78)">
      <rect x="0" y="0" width="380" height="46" rx="10" fill="#F5C842" fill-opacity="0.14" stroke="#F5C842" stroke-opacity="0.6"/>
      <text x="18" y="18" font-size="10" fill="#F5C842" letter-spacing="3" font-weight="700">ANSWER</text>
      <text x="18" y="37" font-size="16" fill="#F5C842" font-weight="700">C — IRSA (IAM Roles for Service Accounts)</text>
    </g>

    <!-- Why -->
    <g transform="translate(28, 148)">
      <text x="0" y="0" font-size="10" fill="#F5C842" letter-spacing="3" font-weight="700">▸ WHY</text>
      <text x="0" y="22" font-size="13" fill="#D1D5DB">IRSA maps a Kubernetes service account to an IAM role</text>
      <text x="0" y="42" font-size="13" fill="#D1D5DB">via OIDC federation. Pods get scoped, temporary AWS</text>
      <text x="0" y="62" font-size="13" fill="#D1D5DB">credentials — no shared node-role blast radius.</text>
    </g>

    <!-- Elimination -->
    <g transform="translate(28, 240)">
      <text x="0" y="0" font-size="10" fill="#F5C842" letter-spacing="3" font-weight="700">▸ ELIMINATION</text>
      <circle cx="6" cy="20" r="2" fill="#9CA3AF"/>
      <text x="18" y="24" font-size="12" fill="#B8B8B8"><tspan fill="#E8E8E8" font-weight="600">A</tspan> — node role grants every pod the same perms (trap: shared)</text>
      <circle cx="6" cy="42" r="2" fill="#9CA3AF"/>
      <text x="18" y="46" font-size="12" fill="#B8B8B8"><tspan fill="#E8E8E8" font-weight="600">B</tspan> — kube2iam is deprecated in EKS</text>
      <circle cx="6" cy="64" r="2" fill="#9CA3AF"/>
      <text x="18" y="68" font-size="12" fill="#B8B8B8"><tspan fill="#E8E8E8" font-weight="600">D</tspan> — long-lived creds in a Secret violates least privilege</text>
    </g>

    <!-- Key rule -->
    <g transform="translate(28, 356)">
      <rect x="0" y="0" width="560" height="60" rx="10" fill="#F5C842" fill-opacity="0.08" stroke="#F5C842" stroke-opacity="0.3"/>
      <text x="18" y="24" font-size="10" fill="#F5C842" letter-spacing="3" font-weight="700">📌  KEY RULE</text>
      <text x="18" y="46" font-size="13" fill="#F5F0DA">Pod-level IAM in EKS = IRSA (or Pod Identity on newer clusters)</text>
    </g>

    <!-- Footer -->
    <text x="28" y="452" font-size="10" fill="#6B7280">For public practice questions only — not for proctored exams.</text>
  </g>
</svg>
