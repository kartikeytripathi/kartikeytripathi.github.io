<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="Kartikey Tripathi — Portfolio banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="50%" stop-color="#0B1026"/>
      <stop offset="100%" stop-color="#080512"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#E879F9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="55%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#67E8F9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FCD34D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base sky + nebulae -->
  <rect width="1600" height="500" fill="url(#sky)"/>
  <rect width="1600" height="500" fill="url(#nebulaA)"/>
  <rect width="1600" height="500" fill="url(#nebulaB)"/>
  <rect width="1600" height="500" fill="url(#nebulaC)"/>

  <!-- Starfield: distant faint stars -->
  <g fill="#E8E8E8">
    <circle cx="34" cy="82" r="0.7" opacity="0.5"/><circle cx="92" cy="140" r="0.5" opacity="0.4"/>
    <circle cx="160" cy="60" r="0.9" opacity="0.6"/><circle cx="220" cy="210" r="0.6" opacity="0.5"/>
    <circle cx="270" cy="120" r="0.8" opacity="0.55"/><circle cx="330" cy="260" r="0.5" opacity="0.4"/>
    <circle cx="390" cy="80" r="0.7" opacity="0.5"/><circle cx="450" cy="180" r="1.0" opacity="0.7"/>
    <circle cx="500" cy="30" r="0.6" opacity="0.5"/><circle cx="560" cy="330" r="0.8" opacity="0.55"/>
    <circle cx="620" cy="230" r="0.5" opacity="0.4"/><circle cx="690" cy="90" r="0.7" opacity="0.55"/>
    <circle cx="760" cy="350" r="0.9" opacity="0.6"/><circle cx="820" cy="200" r="0.5" opacity="0.4"/>
    <circle cx="890" cy="70" r="0.8" opacity="0.55"/><circle cx="940" cy="290" r="0.7" opacity="0.5"/>
    <circle cx="1000" cy="150" r="1.0" opacity="0.7"/><circle cx="1060" cy="380" r="0.5" opacity="0.4"/>
    <circle cx="1120" cy="220" r="0.7" opacity="0.55"/><circle cx="1180" cy="60" r="0.9" opacity="0.6"/>
    <circle cx="1240" cy="310" r="0.6" opacity="0.45"/><circle cx="1300" cy="180" r="0.8" opacity="0.55"/>
    <circle cx="1360" cy="90" r="0.5" opacity="0.4"/><circle cx="1420" cy="270" r="0.7" opacity="0.5"/>
    <circle cx="1480" cy="130" r="0.9" opacity="0.6"/><circle cx="1540" cy="360" r="0.6" opacity="0.5"/>
    <circle cx="60" cy="280" r="0.8" opacity="0.55"/><circle cx="130" cy="400" r="0.5" opacity="0.4"/>
    <circle cx="200" cy="440" r="0.7" opacity="0.5"/><circle cx="300" cy="450" r="0.6" opacity="0.45"/>
    <circle cx="410" cy="410" r="0.9" opacity="0.6"/><circle cx="520" cy="440" r="0.5" opacity="0.4"/>
    <circle cx="640" cy="410" r="0.8" opacity="0.55"/><circle cx="740" cy="440" r="0.6" opacity="0.5"/>
    <circle cx="860" cy="420" r="0.7" opacity="0.5"/><circle cx="980" cy="450" r="0.5" opacity="0.4"/>
    <circle cx="1100" cy="410" r="0.9" opacity="0.6"/><circle cx="1220" cy="440" r="0.6" opacity="0.45"/>
    <circle cx="1340" cy="420" r="0.7" opacity="0.5"/><circle cx="1460" cy="440" r="0.8" opacity="0.55"/>
    <circle cx="1560" cy="60" r="0.6" opacity="0.5"/><circle cx="80" cy="360" r="0.7" opacity="0.5"/>
    <circle cx="240" cy="360" r="0.5" opacity="0.4"/><circle cx="380" cy="340" r="0.8" opacity="0.55"/>
    <circle cx="500" cy="380" r="0.6" opacity="0.5"/><circle cx="600" cy="140" r="0.7" opacity="0.5"/>
    <circle cx="710" cy="270" r="0.5" opacity="0.4"/><circle cx="880" cy="340" r="0.6" opacity="0.5"/>
    <circle cx="1030" cy="60" r="0.7" opacity="0.5"/><circle cx="1150" cy="140" r="0.5" opacity="0.4"/>
    <circle cx="1270" cy="240" r="0.8" opacity="0.55"/><circle cx="1400" cy="340" r="0.6" opacity="0.5"/>
  </g>

  <!-- Bright feature stars with subtle cross glints -->
  <g fill="#FCD34D" filter="url(#glow)">
    <g transform="translate(240, 100)"><circle r="1.6"/><path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#FCD34D" stroke-width="0.6" opacity="0.7"/></g>
    <g transform="translate(1300, 380)"><circle r="1.8"/><path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="#FCD34D" stroke-width="0.6" opacity="0.7"/></g>
    <g transform="translate(1100, 60)"><circle r="1.3"/><path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#FCD34D" stroke-width="0.5" opacity="0.7"/></g>
    <g transform="translate(560, 420)"><circle r="1.4"/><path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#FCD34D" stroke-width="0.5" opacity="0.7"/></g>
    <g transform="translate(820, 40)"><circle r="1.2"/><path d="M -4 0 L 4 0 M 0 -4 L 0 4" stroke="#FCD34D" stroke-width="0.5" opacity="0.6"/></g>
  </g>

  <!-- Orbit rings around the planet -->
  <g transform="translate(1280, 260)" fill="none">
    <ellipse cx="0" cy="0" rx="240" ry="60" stroke="#67E8F9" stroke-opacity="0.28" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="180" ry="180" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" transform="rotate(20)"/>
    <ellipse cx="0" cy="0" rx="130" ry="130" stroke="#E879F9" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Planet + glow -->
  <g transform="translate(1280, 260)">
    <circle r="130" fill="url(#planetGlow)"/>
    <circle r="90" fill="url(#planet)"/>
    <!-- planet ring highlight -->
    <ellipse cx="0" cy="0" rx="150" ry="24" fill="none" stroke="#FCD34D" stroke-opacity="0.5" stroke-width="2" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="150" ry="24" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" transform="rotate(-18) translate(0 -3)"/>
  </g>

  <!-- Orbiting satellites (properties) -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace" font-size="12">
    <!-- Portfolio (this) -->
    <g transform="translate(1150, 170)">
      <circle r="4" fill="#FCD34D"/>
      <rect x="10" y="-11" width="90" height="22" rx="11" fill="#0B1026" stroke="#FCD34D" stroke-opacity="0.6"/>
      <text x="55" y="4" fill="#FCD34D" text-anchor="middle" font-weight="600">portfolio</text>
    </g>
    <!-- Blog -->
    <g transform="translate(1470, 220)">
      <circle r="4" fill="#67E8F9"/>
      <rect x="-90" y="-11" width="80" height="22" rx="11" fill="#0B1026" stroke="#67E8F9" stroke-opacity="0.6"/>
      <text x="-50" y="4" fill="#67E8F9" text-anchor="middle" font-weight="600">blog</text>
    </g>
    <!-- Diagrams -->
    <g transform="translate(1400, 380)">
      <circle r="4" fill="#E879F9"/>
      <rect x="-100" y="-11" width="90" height="22" rx="11" fill="#0B1026" stroke="#E879F9" stroke-opacity="0.6"/>
      <text x="-55" y="4" fill="#E879F9" text-anchor="middle" font-weight="600">diagrams</text>
    </g>
    <!-- KubeForge -->
    <g transform="translate(1120, 340)">
      <circle r="4" fill="#8B5CF6"/>
      <rect x="-105" y="-11" width="95" height="22" rx="11" fill="#0B1026" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="-58" y="4" fill="#A78BFA" text-anchor="middle" font-weight="600">kubeforge</text>
    </g>
    <!-- QuizLens -->
    <g transform="translate(1130, 240)">
      <circle r="4" fill="#FCD34D"/>
      <rect x="-100" y="-11" width="90" height="22" rx="11" fill="#0B1026" stroke="#FCD34D" stroke-opacity="0.6"/>
      <text x="-55" y="4" fill="#FCD34D" text-anchor="middle" font-weight="600">quizlens</text>
    </g>
  </g>

  <!-- Wordmark (left side) -->
  <g transform="translate(90, 175)" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace">
    <text x="0" y="0" font-size="14" fill="#67E8F9" letter-spacing="6">◆  MISSION LOG  ◆</text>
    <text x="0" y="70" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Kartikey Tripathi</text>
    <text x="0" y="110" font-size="22" fill="#C4B5FD">Cloud &amp; DevOps Engineer @ AWS Containers</text>
    <text x="0" y="152" font-size="14" fill="#94A3B8">shipping content, tools, and diagrams for the containers community</text>

    <!-- coordinates line -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" font-size="11" fill="#64748B" letter-spacing="3">COORDINATES</text>
      <text x="0" y="20" font-size="13" fill="#E8E8E8">◦ kartikeytripathi.in    ◦ Bengaluru, IN    ◦ 2026</text>
    </g>
  </g>

  <!-- Shooting star streak -->
  <g transform="translate(700, 90) rotate(20)" opacity="0.9">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="90" cy="0" r="2.5" fill="#67E8F9"/>
  </g>
</svg>
